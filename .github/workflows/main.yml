name: Build Thai Step by Step Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter Stable
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Prepare Android Gradle Project & Assets
        run: |
          cp pubspec.yaml pubspec.yaml.bak
          cp -r lib lib_bak
          rm -rf android test
          flutter create --platforms=android --org com.dennisho35.thaistepbystep --project-name thai_step_by_step .
          rm -rf test
          mv pubspec.yaml.bak pubspec.yaml
          rm -rf lib && mv lib_bak lib
          mkdir -p assets/curriculum assets/web
          if [ ! -f "assets/curriculum/thai_curriculum.json" ]; then
            echo '{"status":"embedded_in_html"}' > assets/curriculum/thai_curriculum.json
          fi
          if [ -f "android/app/build.gradle.kts" ]; then
            sed -i 's/minSdk = .*/minSdk = 26/g' android/app/build.gradle.kts
            sed -i 's/targetSdk = .*/targetSdk = 35/g' android/app/build.gradle.kts
            sed -i 's/compileSdk = .*/compileSdk = 35/g' android/app/build.gradle.kts
          elif [ -f "android/app/build.gradle" ]; then
            sed -i 's/minSdkVersion .*/minSdkVersion 26/g' android/app/build.gradle
            sed -i 's/minSdk .*/minSdk 26/g' android/app/build.gradle
            sed -i 's/targetSdkVersion .*/targetSdkVersion 35/g' android/app/build.gradle
            sed -i 's/targetSdk .*/targetSdk 35/g' android/app/build.gradle
          fi

      - name: Install Dependencies & Run QA Verification
        run: |
          flutter pub get
          flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Build Release APK (API 26-35)
        run: |
          flutter build apk --release

      - name: Upload Installable APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Thai-Step-by-Step-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk
