name: thai_step_by_step
description: 泰語 Step by Step｜泰語一步通 — 專為繁體中文使用者設計的離線優先泰語學習 Android App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_tts: ^4.0.2
  speech_to_text: ^6.6.0
  sqflite: ^2.3.3
  shared_preferences: ^2.2.3
  path_provider: ^2.1.3
  webview_flutter: ^4.8.0
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/curriculum/thai_curriculum.json
    - assets/web/thai_step_by_step_app.html
